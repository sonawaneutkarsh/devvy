name: CI

# Normal changes run here. release.yml calls this same workflow (workflow_call)
# as its gate, so a tag can only publish after this exact verification passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload the verified release payloads for the calling workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release run
  # never shares (or cancels) a group with a normal CI run.
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Test, package, and build payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve version
        id: version
        run: |
          VERSION="$(./scripts/version.sh)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Devvy version: ${VERSION}"

      - name: Check version references
        run: ./scripts/check-versions.sh

      - name: Validate script syntax
        run: |
          for f in install.sh uninstall.sh scripts/*.sh daemon/*.sh; do bash -n "$f"; done
          for f in daemon/*.mjs windows/*.mjs scripts/*.mjs; do node --check "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync("daemon/config.json"))'

      - name: Run test suite (24 scripts)
        run: npm test

      - name: Install pinned packaging tooling
        run: npm ci

      - name: Package VS Code extension
        working-directory: vscode-extension
        run: npx --no-install vsce package --out "../devvy-${{ steps.version.outputs.version }}.vsix"

      - name: Inspect VSIX contents
        env:
          VSIX: devvy-${{ steps.version.outputs.version }}.vsix
        run: |
          unzip -l "${VSIX}"
          FILES="$(unzip -Z1 "${VSIX}" | sort)"
          EXPECTED=$'[Content_Types].xml\nextension.vsixmanifest\nextension/LICENSE.txt\nextension/extension.js\nextension/icon.png\nextension/package.json\nextension/readme.md'
          if [ "${FILES}" != "${EXPECTED}" ]; then
            printf '::error::Unexpected VSIX contents\n'
            diff <(printf '%s\n' "${EXPECTED}") <(printf '%s\n' "${FILES}") || true
            exit 1
          fi
          if unzip -Z1 "${VSIX}" | grep -Ei '\.log$|\.env$|\.vsix$|node_modules|\.git'; then
            printf '::error::VSIX contains development files (listed above)\n'
            exit 1
          fi

      - name: Build and validate macOS payloads
        run: |
          mkdir -p dist
          for arch in arm64 x86_64; do
            DEVVY_ARCH="${arch}" ./scripts/package-release.sh "dist/devvy-macos-${arch}.tar.gz"
            ./scripts/test-release-payload.sh "${arch}" "dist/devvy-macos-${arch}.tar.gz"
          done

      - name: Build and validate Windows payload
        run: |
          ./scripts/package-windows-release.sh dist/devvy-windows-x86_64.zip
          ./scripts/test-windows-payload.sh dist/devvy-windows-x86_64.zip

      - name: Collect verified payloads
        if: inputs.upload-artifacts
        run: |
          cp "devvy-${{ steps.version.outputs.version }}.vsix" dist/
          ls -l dist

      - name: Upload verified payloads
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devvy-release-payloads
          path: dist/
          if-no-files-found: error
          retention-days: 7
