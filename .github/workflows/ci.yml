name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate scripts and daemon
        run: |
          bash -n install.sh scripts/package-release.sh
          node --check daemon/daemon.mjs
          node --check daemon/discord-ipc.mjs
          node --check daemon/model-display.mjs
          node --check daemon/presence.mjs
          node --check windows/windows-utils.mjs
          node -e 'JSON.parse(require("fs").readFileSync("daemon/config.json"))'
      - name: Run daemon tests
        run: |
          for test in daemon/test-*.mjs; do node "$test"; done
          for test in daemon/test-*.sh; do "$test"; done
          node windows/test-windows-utils.mjs
      - name: Install pinned packaging tooling
        run: npm ci
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: npx --no-install vsce package --out ../devvy-4.0.2.vsix
      - name: Inspect VSIX contents
        run: |
          unzip -l devvy-4.0.2.vsix
          FILES="$(unzip -Z1 devvy-4.0.2.vsix | sort)"
          EXPECTED=$'[Content_Types].xml\nextension.vsixmanifest\nextension/LICENSE.txt\nextension/extension.js\nextension/icon.png\nextension/package.json\nextension/readme.md'
          test "${FILES}" = "${EXPECTED}" || { printf 'Unexpected VSIX contents:\n%s\n' "${FILES}" >&2; exit 1; }
          ! unzip -Z1 devvy-4.0.2.vsix | grep -Ei '\.log$|\.env$|\.vsix$|node_modules|\.git'
      - name: Validate release payload
        run: |
          DEVVY_ARCH=arm64 ./scripts/package-release.sh /tmp/devvy-macos-arm64.tar.gz
          DEVVY_ARCH=x86_64 ./scripts/package-release.sh /tmp/devvy-macos-x86_64.tar.gz
          ./scripts/test-release-payload.sh arm64 /tmp/devvy-macos-arm64.tar.gz
          ./scripts/test-release-payload.sh x86_64 /tmp/devvy-macos-x86_64.tar.gz
      - name: Validate Windows installer scripts
        run: |
          DEVVY_VERSION=4.1.0 ./scripts/package-windows-release.sh /tmp/devvy-windows-x86_64.zip
          ./scripts/test-windows-payload.sh /tmp/devvy-windows-x86_64.zip
          test -s /tmp/devvy-windows-x86_64.zip.sha256
